{% extends "base.html" %}

{% block title %}{% if course %}تعديل المقرر{% else %}إضافة مقرر جديد{% endif %}{% endblock %}

{% block content %}
<h2 class="mb-4">
    <i class="bi bi-book"></i> 
    {% if course %}تعديل المقرر{% else %}إضافة مقرر جديد{% endif %}
</h2>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">عنوان المقرر</label>
                        <input type="text" class="form-control" id="title" name="title" 
                               value="{{ course.title if course else '' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">وصف المقرر</label>
                        <textarea class="form-control" id="description" name="description" rows="4">{{ course.description if course else '' }}</textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> {% if course %}حفظ التعديلات{% else %}إضافة المقرر{% endif %}
                    </button>
                    <a href="{{ url_for('admin_courses') }}" class="btn btn-secondary">إلغاء</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
