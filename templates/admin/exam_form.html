{% extends "base.html" %}

{% block title %}{% if exam %}تعديل الامتحان{% else %}إضافة امتحان جديد{% endif %}{% endblock %}

{% block content %}
<h2 class="mb-4">{% if exam %}تعديل الامتحان{% else %}إضافة امتحان جديد{% endif %}</h2>

<form method="POST" id="examForm">
    <div class="row">
        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-body">
                    <div class="mb-3">
                        <label for="title" class="form-label">عنوان الامتحان</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ exam.title if exam else '' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">وصف الامتحان</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ exam.description if exam else '' }}</textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="course_id" class="form-label">المقرر</label>
                            <select class="form-select" id="course_id" name="course_id" required>
                                {% for course in courses %}
                                <option value="{{ course.id }}" {% if exam and exam.course_id == course.id %}selected{% endif %}>{{ course.title }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="col-md-3 mb-3">
                            <label for="duration_minutes" class="form-label">المدة (دقيقة)</label>
                            <input type="number" class="form-control" id="duration_minutes" name="duration_minutes" value="{{ exam.duration_minutes if exam else '60' }}">
                        </div>
                        
                        <div class="col-md-3 mb-3">
                            <label for="passing_score" class="form-label">درجة النجاح (%)</label>
                            <input type="number" class="form-control" id="passing_score" name="passing_score" value="{{ exam.passing_score if exam else '50' }}">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h5><i class="bi bi-list-check"></i> أسئلة الامتحان</h5>
                </div>
                <div class="card-body">
                    <div id="questions_container"></div>
                    
                    <button type="button" class="btn btn-outline-primary mb-3" onclick="addQuestion()">
                        <i class="bi bi-plus-circle"></i> إضافة سؤال
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <button type="submit" class="btn btn-primary mt-3">
        <i class="bi bi-check-lg"></i> حفظ الامتحان
    </button>
    <a href="{{ url_for('admin_exams') }}" class="btn btn-secondary mt-3">إلغاء</a>
</form>
{% endblock %}

{% block extra_js %}
<script>
let questionCount = 0;

function addQuestion() {
    questionCount++;
    const container = document.getElementById('questions_container');
    
    const questionDiv = document.createElement('div');
    questionDiv.className = 'card mb-3';
    questionDiv.innerHTML = `
        <div class="card-body">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">نص السؤال</label>
                    <textarea class="form-control" name="question_text[]" required></textarea>
                </div>
                
                <div class="col-md-3 mb-3">
                    <label class="form-label">النقاط</label>
                    <input type="number" class="form-control" name="points[]" value="1" min="1">
                </div>
                
                <div class="col-md-3 mb-3">
                    <label class="form-label">الإجابة الصحيحة</label>
                    <select class="form-select" name="correct_answer[]" required>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
                
                <div class="col-md-3 mb-3">
                    <label class="form-label">الخيار A</label>
                    <input type="text" class="form-control" name="option_a[]" required>
                </div>
                
                <div class="col-md-3 mb-3">
                    <label class="form-label">الخيار B</label>
                    <input type="text" class="form-control" name="option_b[]" required>
                </div>
                
                <div class="col-md-3 mb-3">
                    <label class="form-label">الخيار C</label>
                    <input type="text" class="form-control" name="option_c[]" required>
                </div>
                
                <div class="col-md-3 mb-3">
                    <label class="form-label">الخيار D</label>
                    <input type="text" class="form-control" name="option_d[]" required>
                </div>
            </div>
            
            <button type="button" class="btn btn-sm btn-danger" onclick="this.closest('.card').remove()">
                <i class="bi bi-trash"></i> حذف السؤال
            </button>
        </div>
    `;
    
    container.appendChild(questionDiv);
}

// Add initial questions
for(let i = 0; i < 3; i++) addQuestion();
</script>
{% endblock %}
