{% extends "base.html" %}

{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">
                    <i class="bi bi-box-arrow-in-right"></i> تسجيل الدخول
                </h2>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="email_or_phone" class="form-label">البريد الإلكتروني أو رقم الهاتف</label>
                        <input type="text" class="form-control" id="email_or_phone" name="email_or_phone" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">كلمة المرور</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right"></i> دخول
                        </button>
                    </div>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">نسيت كلمة المرور؟</a>
                </div>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-0">ليس لديك حساب؟</p>
                    <a href="{{ url_for('register') }}" class="btn btn-outline-primary mt-2">
                        <i class="bi bi-person-plus"></i> تسجيل جديد
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
