{% extends "base.html" %}

{% block title %}قيد المراجعة{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <i class="bi bi-hourglass-split text-warning" style="font-size: 4rem;"></i>
                </div>
                
                <h3 class="mb-3">حسابك قيد المراجعة</h3>
                
                <p class="text-muted mb-4">
                    تم تسجيل حسابك بنجاح وهو الآن قيد المراجعة من قبل الإدارة.
                    <br>
                    سيتم إعلامك عند قبول حسابك.
                </p>
                
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> يرجى التحلي بالصبر، ستتم المراجعة في أقرب وقت ممكن.
                </div>
                
                <a href="{{ url_for('logout') }}" class="btn btn-outline-primary mt-3">
                    <i class="bi bi-box-arrow-right"></i> تسجيل الخروج
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
