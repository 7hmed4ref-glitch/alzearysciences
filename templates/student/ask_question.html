{% extends "base.html" %}

{% block title %}طرح استفسار{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('student_questions') }}" class="text-decoration-none">
        <i class="bi bi-arrow-right"></i> العودة لاستفساراتي
    </a>
</div>

<h2 class="mb-4"><i class="bi bi-question-circle"></i> طرح استفسار جديد</h2>

<form method="POST">
    <div class="mb-3">
        <label for="subject" class="form-label">موضوع الاستفسار</label>
        <input type="text" class="form-control" id="subject" name="subject" required>
    </div>
    
    <div class="mb-3">
        <label for="message" class="form-label">تفاصيل الاستفسار</label>
        <textarea class="form-control" id="message" name="message" rows="6" required></textarea>
    </div>
    
    <button type="submit" class="btn btn-primary">
        <i class="bi bi-send"></i> إرسال الاستفسار
    </button>
</form>
{% endblock %}
