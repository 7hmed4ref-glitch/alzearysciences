{% extends "base.html" %}

{% block title %}تقديم شكوى{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('student_complaints') }}" class="text-decoration-none">
        <i class="bi bi-arrow-right"></i> العودة لشكاويي
    </a>
</div>

<h2 class="mb-4"><i class="bi bi-exclamation-triangle"></i> تقديم شكوى جديدة</h2>

<form method="POST">
    <div class="mb-3">
        <label for="subject" class="form-label">موضوع الشكوى</label>
        <input type="text" class="form-control" id="subject" name="subject" required>
    </div>
    
    <div class="mb-3">
        <label for="message" class="form-label">تفاصيل الشكوى</label>
        <textarea class="form-control" id="message" name="message" rows="6" required></textarea>
    </div>
    
    <button type="submit" class="btn btn-danger">
        <i class="bi bi-send"></i> إرسال الشكوى
    </button>
</form>
{% endblock %}
