{% extends "base.html" %}

{% block title %}البث المباشر{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-broadcast"></i> البث المباشر</h2>

<div class="row">
    {% for stream in streams %}
    <div class="col-md-8 mb-4">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5>{{ stream.title }}</h5>
                <span class="badge bg-danger"><i class="bi bi-circle-fill"></i> مباشر</span>
            </div>
            <div class="card-body">
                {% if stream.stream_url %}
                <div class="ratio ratio-16x9 mb-3">
                    <iframe src="{{ stream.stream_url }}" allowfullscreen allow="autoplay; encrypted-media"></iframe>
                </div>
                {% endif %}
                <p>{{ stream.description or '' }}</p>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12">
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i> لا يوجد بث مباشر نشط حالياً.
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
