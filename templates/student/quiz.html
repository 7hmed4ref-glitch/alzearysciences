{% extends "base.html" %}

{% block title %}{{ quiz.title }}{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('student_lesson', lesson_id=lesson.id) }}" class="text-decoration-none">
        <i class="bi bi-arrow-right"></i> العودة للدرس
    </a>
</div>

<h2 class="mb-4"><i class="bi bi-question-circle"></i> {{ quiz.title }}</h2>

<form method="POST" id="quizForm">
    <div class="card mb-4">
        <div class="card-body">
            {% for question in quiz.questions %}
            <div class="mb-4 pb-4 border-bottom">
                <h5>{{ loop.index }}. {{ question.text }}</h5>
                
                {% if question.question_type == 'true_false' %}
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="question_{{ question.id }}" value="True" required>
                    <label class="form-check-label">صح</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="question_{{ question.id }}" value="False" required>
                    <label class="form-check-label">خطأ</label>
                </div>
                {% else %}
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="question_{{ question.id }}" value="A" required>
                    <label class="form-check-label">{{ question.option_a }}</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="question_{{ question.id }}" value="B" required>
                    <label class="form-check-label">{{ question.option_b }}</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="question_{{ question.id }}" value="C" required>
                    <label class="form-check-label">{{ question.option_c }}</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="question_{{ question.id }}" value="D" required>
                    <label class="form-check-label">{{ question.option_d }}</label>
                </div>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </div>
    
    <button type="submit" class="btn btn-primary btn-lg">
        <i class="bi bi-check-lg"></i> إرسال الإجابات
    </button>
</form>
{% endblock %}
